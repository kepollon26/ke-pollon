<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Médica</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #F5F8F8;
    --panel: #FFFFFF;
    --line: #E1E9EA;
    --line-soft: #EDF3F3;
    --ink: #16302E;
    --ink-soft: #5C7573;
    --teal: #0E7C7B;
    --teal-deep: #0A5F5E;
    --coral: #FF6152;
    --slot-hover: #EAF4F3;
    --today-tint: #F0FAF8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ margin:0; }
  body{ background:#E9EEEE; min-height:100vh; }
  .agenda-root{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
    max-width:420px;
    margin:0 auto;
  }

  /* ---- Tablet ---- */
  @media (min-width:600px) and (max-width:1023px){
    body{ padding:16px; }
    .agenda-root{
      max-width:100%;
      border-radius:14px;
    }
    .ag-scroll{ max-height:560px; }
    .ag-title{ font-size:18px; }
    .ag-daystrip{ justify-content:space-between; }
    .ag-chip{ width:56px; padding:8px 0 9px; }
    .ag-chip .cnum{ font-size:16px; }
    .ag-item .aname{ font-size:13px; }
  }

  /* ---- Laptop / monitor ---- */
  @media (min-width:1024px){
    body{ padding:24px; }
    .agenda-root{
      max-width:100%;
      border-radius:14px;
    }
    .ag-scroll{ max-height:calc(100vh - 260px); }
    .ag-title{ font-size:19px; }
    .ag-daystrip{ justify-content:space-between; }
    .ag-chip{ width:64px; padding:9px 0 10px; }
    .ag-chip .cnum{ font-size:17px; }
    .ag-item .aname{ font-size:13.5px; }
    .ag-item .atime{ font-size:11px; }
    .ag-tool-btn{ padding:11px 6px; font-size:13px; }
  }

  /* ---- Header ---- */
  .ag-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 8px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .ag-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:.2px;
  }
  .ag-title .dot{ color:var(--teal); }
  .ag-nav{ display:flex; align-items:center; gap:4px; }
  .ag-nav button{
    border:none; background:var(--line-soft); color:var(--teal-deep);
    width:30px; height:30px; border-radius:9px; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ag-nav button:active{ background:var(--teal); color:#fff; }
  .ag-today-btn{
    font-size:11px; font-weight:600; color:var(--teal-deep);
    background:#fff; border:1px solid var(--teal); border-radius:8px;
    padding:5px 9px; cursor:pointer; margin-left:4px;
  }

  .ag-range{
    font-size:11px; color:var(--teal-deep); font-weight:700;
    padding:0 14px 8px; background:var(--panel); cursor:pointer;
    display:inline-block; width:100%;
  }

  /* ---- Day strip ---- */
  .ag-daystrip{
    display:flex; gap:6px; padding:0 10px 10px;
    overflow-x:auto; background:var(--panel);
    scrollbar-width:none;
  }
  .ag-daystrip::-webkit-scrollbar{ display:none; }
  .ag-chip{
    flex:0 0 auto; width:44px; padding:6px 0 7px;
    border-radius:12px; text-align:center; cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
  }
  .ag-chip .cname{ font-size:9px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); font-weight:700; }
  .ag-chip .cnum{ font-size:15px; font-weight:700; margin-top:2px; }
  .ag-chip.is-today{ border-color:var(--teal); }
  .ag-chip.is-today .cnum{ color:var(--teal-deep); }
  .ag-chip.is-sel{ background:var(--teal); border-color:var(--teal); }
  .ag-chip.is-sel .cname, .ag-chip.is-sel .cnum{ color:#fff; }
  .ag-chip.is-holiday{ background:#FFF3CD; border-color:#F0D98A; }
  .ag-chip.is-holiday .cnum{ color:#7A5A00; }
  .ag-chip.is-holiday.is-sel{ background:var(--teal); border-color:var(--teal); }
  .ag-chip.is-holiday.is-sel .cnum{ color:#fff; }
  .ag-chip .cdot{ width:4px; height:4px; border-radius:50%; background:var(--teal); margin:3px auto 0; visibility:hidden; }
  .ag-chip.has-appt .cdot{ visibility:visible; }
  .ag-chip.is-sel .cdot{ background:#fff; }

  /* ---- Toolbar: buscar / huecos ---- */
  .ag-toolbar{ display:flex; gap:8px; padding:0 14px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  .ag-tool-btn{
    flex:1; font-size:12px; font-weight:700; padding:9px 6px; border-radius:10px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .ag-tool-btn.active{ background:var(--teal); border-color:var(--teal); color:#fff; }

  .ag-gaps-panel{ padding:10px 14px 4px; background:var(--panel); display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); }
  .ag-gap-chip{ font-size:11px; font-weight:700; padding:7px 11px; border-radius:14px; background:var(--today-tint); border:1px dashed var(--teal); color:var(--teal-deep); cursor:pointer; }
  .ag-gap-empty{ font-size:12px; color:var(--ink-soft); padding:4px 0 10px; }

  /* ---- Scroll area (single day) ---- */
  .ag-scroll{
    overflow-y:auto; max-height:480px;
    background:var(--panel);
  }
  .ag-grid-body{
    display:grid; grid-template-columns: 46px 1fr;
    position:relative;
  }
  .ag-timecol{ position:relative; }
  .ag-timecol .tick{
    position:absolute; right:6px; transform:translateY(-50%);
    font-size:9.5px; color:var(--ink-soft); font-weight:600;
  }
  .ag-daycol{
    position:relative;
    border-left:1px solid var(--line-soft);
    background-image: repeating-linear-gradient(
      to bottom,
      var(--line-soft) 0px, var(--line-soft) 1px,
      transparent 1px, transparent var(--slotpx)
    );
    cursor:pointer;
  }
  .ag-daycol.is-today{ background-color:var(--today-tint); }
  .ag-daycol .hourline{
    position:absolute; left:0; right:0; border-top:1px solid var(--line);
    pointer-events:none;
  }

  .ag-current-line{
    position:absolute; left:0; right:0; height:0;
    border-top:2px solid var(--coral);
    z-index:4; pointer-events:none;
  }
  .ag-current-line::before{
    content:''; position:absolute; left:-4px; top:-4px;
    width:8px; height:8px; border-radius:50%; background:var(--coral);
  }

  .ag-item{
    position:absolute; left:5px; right:5px;
    border-radius:9px; padding:5px 8px;
    overflow:hidden; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    border-left:3px solid transparent;
  }
  .ag-item .aname{ font-size:12.5px; font-weight:700; line-height:1.25; }
  .ag-item .aname.strike{ text-decoration:line-through; }
  .ag-item .anote{ font-size:10.5px; opacity:.85; line-height:1.2; margin-top:1px; }
  .ag-item .atime{ font-size:10px; opacity:.8; font-weight:600; margin-top:1px; }
  .ag-item .abadge{ position:absolute; top:5px; right:7px; font-size:11px; }
  .ag-item.is-dim{ opacity:.55; }
  .ag-item.status-no_asistio{
    background:#FCE1DC !important; border-left-color:#FF6152 !important; color:#B23225 !important; opacity:1 !important;
  }
  .ag-item .ano-show{
    position:absolute; top:50%; right:62px; transform:translateY(-50%);
    width:24px; height:24px; border-radius:50%;
    background:#fff; border:1.5px solid var(--coral); color:var(--coral);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; cursor:pointer;
  }
  .ag-item .ano-show.active{ background:var(--coral); color:#fff; }
  .ag-item.is-block{
    background-image: repeating-linear-gradient(45deg, #E7ECEC, #E7ECEC 6px, #DEE5E5 6px, #DEE5E5 12px);
    border-left-color:#8AA0A0; color:#445454;
  }
  .ag-item .acall{ display:inline-block; margin-left:6px; text-decoration:none; }
  .ag-item.has-wa{ padding-right:8px; }
  .ag-item .await-wa{
    position:absolute; top:50%; right:98px; transform:translateY(-50%);
    width:25px; height:25px; border-radius:7px; background:#25D366;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .ag-item .await-wa svg{ width:14px; height:14px; }

  .ag-empty-hint{
    text-align:center; font-size:12px; color:var(--ink-soft);
    padding:10px 14px 6px; background:var(--panel);
  }

  /* ---- Add/edit panel ---- */
  .ag-panel-overlay{
    position:fixed; inset:0; background:rgba(15,30,29,.4);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .ag-panel{
    background:#fff; width:100%; max-width:420px;
    border-radius:18px 18px 0 0; padding:18px 18px 22px;
    font-family:'Inter',sans-serif;
    max-height:88vh; overflow-y:auto;
  }
  .ag-panel h3{
    font-family:'Fraunces',serif; font-size:16px; margin:0 0 12px; color:var(--ink);
  }
  .ag-mode-tabs{ display:flex; gap:6px; margin-bottom:14px; background:var(--line-soft); padding:4px; border-radius:12px; }
  .ag-mode-tab{ flex:1; text-align:center; padding:8px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); }
  .ag-mode-tab.sel{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .ag-field{ margin-bottom:12px; }
  .ag-field label{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; }
  .ag-field.has-suggest{ position:relative; }
  .ag-suggest-list{
    position:absolute; left:0; right:0; top:100%; margin-top:2px;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 6px 18px rgba(16,45,44,.14); max-height:180px; overflow-y:auto; z-index:5;
  }
  .ag-suggest-item{ padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft); }
  .ag-suggest-item:last-child{ border-bottom:none; }
  .ag-suggest-item .sgname{ font-size:13px; font-weight:700; color:var(--ink); }
  .ag-suggest-item .sgmeta{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .ag-field input, .ag-field select{
    width:100%; margin-top:5px; padding:10px 10px; border-radius:9px;
    border:1px solid var(--line); font-size:14px; font-family:inherit; background:#F9FBFB;
  }
  .ag-row2{ display:flex; gap:10px; }
  .ag-row2 > div{ flex:1; }
  .ag-types{ display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
  .ag-type-chip{
    display:flex; align-items:center; gap:6px;
    padding:7px 10px; border-radius:20px; border:1.5px solid var(--line);
    font-size:12px; font-weight:600; cursor:pointer; background:#fff;
  }
  .ag-type-chip .dot{ width:9px; height:9px; border-radius:50%; }
  .ag-type-chip.sel{ border-color:var(--ink); background:#F5F8F8; }
  .ag-status-row{ display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
  .ag-status-chip{
    display:flex; align-items:center; gap:5px;
    padding:7px 10px; border-radius:20px; border:1.5px solid var(--line);
    font-size:12px; font-weight:600; cursor:pointer; background:#fff;
  }
  .ag-status-chip.sel{ border-color:var(--ink); background:#F5F8F8; }
  .ag-warn{ font-size:11px; color:var(--coral); margin-top:5px; font-weight:600; }

  .ag-panel-actions{ display:flex; gap:8px; margin-top:16px; }
  .ag-btn{
    flex:1; border:none; padding:12px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .ag-btn.primary{ background:var(--teal); color:#fff; }
  .ag-btn.ghost{ background:var(--line-soft); color:var(--ink); }
  .ag-btn.danger{ background:#FFEDEA; color:var(--coral); flex:0 0 auto; padding:12px 14px; }

  /* ---- Search overlay ---- */
  .ag-search-panel{
    background:#fff; width:100%; max-width:420px;
    border-radius:18px 18px 0 0; padding:16px 16px 18px;
    max-height:82vh; display:flex; flex-direction:column;
  }
  .ag-search-panel h3{ font-family:'Fraunces',serif; font-size:16px; margin:0 0 10px; }
  .ag-search-input{ width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); font-size:14px; margin-bottom:10px; }
  .ag-search-results{ overflow-y:auto; }
  .ag-search-item{ padding:10px 6px; border-bottom:1px solid var(--line-soft); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .ag-search-item .sname{ font-weight:700; font-size:13px; }
  .ag-search-item .smeta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .ag-search-empty{ text-align:center; color:var(--ink-soft); font-size:12px; padding:24px 0; }

  /* ---- Selector de mes ---- */
  .ag-month-panel{
    background:#fff; width:100%; max-width:420px;
    border-radius:18px 18px 0 0; padding:16px 16px 20px;
    font-family:'Inter',sans-serif;
  }
  .ag-month-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .ag-month-head h3{ font-family:'Fraunces',serif; font-size:16px; margin:0; }
  .ag-month-head button{
    border:none; background:var(--line-soft); color:var(--teal-deep);
    width:30px; height:30px; border-radius:9px; font-size:15px; cursor:pointer;
  }
  .ag-month-dow{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
  .ag-month-dow div{ text-align:center; font-size:10px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; }
  .ag-month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .ag-month-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; position:relative;
    color:var(--ink);
  }
  .ag-month-cell.is-muted{ color:#C6D2D2; }
  .ag-month-cell.is-today{ border:1.5px solid var(--teal); }
  .ag-month-cell.is-sel{ background:var(--teal); color:#fff; }
  .ag-month-cell.is-holiday{ background:#FFF3CD; color:#7A5A00; }
  .ag-month-cell.is-holiday.is-sel{ background:var(--teal); color:#fff; }
  .ag-month-cell .mdot{ width:4px; height:4px; border-radius:50%; background:var(--teal); margin-top:2px; visibility:hidden; }
  .ag-month-cell.has-appt .mdot{ visibility:visible; }
  .ag-month-cell.is-sel .mdot{ background:#fff; }
  .ag-month-today-btn{
    display:block; margin:14px auto 0; font-size:12px; font-weight:700; color:var(--teal-deep);
    background:var(--line-soft); border:none; border-radius:9px; padding:9px 16px; cursor:pointer;
  }

  /* ---- Confirm dialog ---- */
  .ag-confirm-overlay{ position:fixed; inset:0; background:rgba(15,30,29,.45); display:flex; align-items:center; justify-content:center; z-index:70; padding:22px; }
  .ag-confirm-box{ background:#fff; border-radius:16px; padding:18px; max-width:340px; width:100%; }
  .ag-confirm-box p{ font-size:13.5px; color:var(--ink); margin:0 0 14px; line-height:1.4; }
  .ag-confirm-actions{ display:flex; flex-direction:column; gap:8px; }

  .ag-loading{ padding:40px; text-align:center; color:var(--ink-soft); font-size:13px; }
</style>
</head>
<body>

<div class="agenda-root" id="agRoot">
  <div class="ag-loading" id="agLoading">Cargando agenda…</div>
</div>

<script>
(function(){
  const TYPES = [
    {id:'general',    label:'General',     bg:'#DCEAFB', border:'#4F86C6', text:'#1D4E8F'},
    {id:'primera',     label:'Primera vez', bg:'#EAE1FA', border:'#8E6FD8', text:'#5A3EA6'},
    {id:'seguimiento', label:'Seguimiento', bg:'#DDF3E4', border:'#3FA968', text:'#1C6B3A'},
    {id:'estudios',    label:'Estudios',    bg:'#FCEBCF', border:'#E0972E', text:'#8A5A0C'},
    {id:'urgencia',    label:'Urgencia',    bg:'#FCE1DC', border:'#FF6152', text:'#B23225'},
  ];
  const STATUSES = [
    {id:'confirmada', label:'Confirmada', icon:'✓', dim:false, strike:false},
    {id:'pendiente',  label:'Pendiente',  icon:'⏳', dim:false, strike:false},
    {id:'cancelada',  label:'Cancelada',  icon:'✕', dim:true,  strike:true},
    {id:'no_asistio', label:'No asistió', icon:'⚠', dim:false, strike:false},
  ];
  const DAY_START = 8*60;
  const DAY_END   = 22*60;
  const PX_PER_MIN = 1.4;
  const SLOT_MIN = 30;
  const SLOT_PX = SLOT_MIN * PX_PER_MIN;
  const GRID_PAD = 14;
  const DAY_NAMES = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];

  let weekOffset = 0;
  let selectedISO = fmtISOtoday();
  let appts = [];
  let pendingSlot = null;
  let editingId = null;
  let chosenType = TYPES[0].id;
  let chosenStatus = STATUSES[0].id;
  let panelMode = 'paciente'; // 'paciente' | 'bloqueo'
  let showGaps = false;
  let countryCode = '52';

  const root = document.getElementById('agRoot');

  function fmtISOtoday(){ return fmtISO(new Date()); }
  function mondayOf(date){
    const d = new Date(date);
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0,0,0,0);
    return d;
  }
  function fmtISO(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  }
  function addDays(d,n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }

  // ---------- Días festivos (México) ----------
  function nthWeekdayOfMonth(year, month, weekday, n){
    let d = new Date(year, month, 1);
    let count = 0;
    while(true){
      if(d.getDay()===weekday){ count++; if(count===n) return d; }
      d.setDate(d.getDate()+1);
    }
  }
  function easterSunday(year){
    const a=year%19, b=Math.floor(year/100), c=year%100, d2=Math.floor(b/4), e=b%4;
    const f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d2-g+15)%30;
    const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
    const month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return new Date(year, month-1, day);
  }
  const holidayCache = {};
  function getHolidaysForYear(year){
    if(holidayCache[year]) return holidayCache[year];
    const easter = easterSunday(year);
    const list = [
      { date: fmtISO(new Date(year,0,1)),  name:'Año Nuevo' },
      { date: fmtISO(nthWeekdayOfMonth(year,1,1,1)),  name:'Día de la Constitución' },
      { date: fmtISO(nthWeekdayOfMonth(year,2,1,3)),  name:'Natalicio de Benito Juárez' },
      { date: fmtISO(addDays(easter,-3)),  name:'Jueves Santo' },
      { date: fmtISO(addDays(easter,-2)),  name:'Viernes Santo' },
      { date: fmtISO(new Date(year,4,1)),  name:'Día del Trabajo' },
      { date: fmtISO(new Date(year,8,16)), name:'Día de la Independencia' },
      { date: fmtISO(new Date(year,10,2)), name:'Día de Muertos' },
      { date: fmtISO(nthWeekdayOfMonth(year,10,1,3)), name:'Día de la Revolución' },
      { date: fmtISO(new Date(year,11,25)), name:'Navidad' },
    ];
    const map = {};
    list.forEach(h=>{ map[h.date] = h.name; });
    holidayCache[year] = map;
    return map;
  }
  function getHolidayName(iso){
    const year = parseInt(iso.slice(0,4),10);
    const map = getHolidaysForYear(year);
    return map[iso] || null;
  }
  function minToLabel(min){
    const h = Math.floor(min/60), m = min%60;
    const ampm = h>=12 ? 'p.m.' : 'a.m.';
    let h12 = h%12; if(h12===0) h12=12;
    return m===0 ? (h12+' '+ampm) : (h12+':'+String(m).padStart(2,'0')+' '+ampm);
  }

  // ======================================================================
  // CONFIGURACIÓN DE FIREBASE — reemplaza estos valores con los de TU
  // proyecto (Firebase console > ⚙ Configuración del proyecto > Tus apps
  // > selecciona la app web > "SDK setup and configuration" > Config).
  // ======================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDp-lRru0ZADUwNoKgfNUy4skQEZ93sCxM",

  let dbRef = null;
  let firebaseNotConfigured = false;
  let firebaseAuthError = false;
  async function initDb(){
    try{
      if(!firebaseConfig.apiKey || firebaseConfig.apiKey === 'TU_API_KEY'){
        firebaseNotConfigured = true;
        return;
      }
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
      dbRef = firebase.firestore().collection('data').doc('agenda');
    }catch(e){
      console.error('Error iniciando Firebase', e);
      dbRef = null;
      if(e && e.code === 'auth/operation-not-allowed'){
        firebaseAuthError = true;
      } else {
        firebaseNotConfigured = true;
      }
    }
  }
  function applyStateData(data){
    appts = Array.isArray(data && data.appts) ? data.appts : [];
    if(data && data.countryCode) countryCode = data.countryCode;
  }
  let saveError = null;
  async function saveState(){
    if(!dbRef){ saveError = 'Firebase no está conectado (revisa la configuración).'; render(); return; }
    try{
      await dbRef.set({ appts, countryCode });
      if(saveError){ saveError = null; render(); }
    }catch(e){
      console.error('No se pudo guardar en Firestore', e);
      saveError = (e && e.message) ? e.message : String(e);
      render();
    }
  }
  function subscribeState(onFirst){
    if(!dbRef){ render(); onFirst && onFirst(); return; }
    let first = true;
    dbRef.onSnapshot((snap)=>{
      if(snap.exists) applyStateData(snap.data());
      render();
      if(first){ first=false; onFirst && onFirst(); }
    }, (err)=>{
      console.error('Firestore error', err);
      render();
      if(first){ first=false; onFirst && onFirst(); }
    });
  }

        chosenStatus = STATUSES[0].id;

        openPanel(null, Math.min(30, end-start));

  }

  function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  function buildTicks(){
    let out='';
    for(let m=DAY_START; m<=DAY_END; m+=60){
      const top = (m-DAY_START)*PX_PER_MIN;
      out += `<div class="tick" style="top:${top}px">${minToLabel(m)}</div>`;
    }
    return out;
  }
  function buildHourLines(){
    let out='';
    for(let m=DAY_START; m<=DAY_END; m+=60){
      const top=(m-DAY_START)*PX_PER_MIN;
      out += `<div class="hourline" style="top:${top}px"></div>`;
    }
    return out;
  }
  function buildItems(iso){

      const t = TYPES.find(t=>t.id===a.type) || TYPES[0];
      const st = STATUSES.find(s=>s.id===a.status) || STATUSES[0];
      const rawDigits = a.phone ? a.phone.replace(/\D/g,'') : '';

      const callBtn = a.phone ? `<a class="acall" href="tel:${escapeHtml(a.phone)}">📞</a>` : '';
      const waBtn = waDigits ? `<a class="await-wa" href="https://wa.me/${waDigits}" target="_blank" rel="noopener" title="Enviar WhatsApp">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5s-.6-1.5-.9-2c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.6 1.1 2.8c.1.2 1.9 2.9 4.6 4 .6.3 1.1.4 1.5.6.6.2 1.2.2 1.6.1.5-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.5-.3z"/><path fill="#fff" d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5.1-1.3c1.4.8 3.1 1.2 4.9 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.2-.4-4.5-1.2l-.3-.2-3 .8.8-2.9-.2-.3C4 15.1 3.6 13.6 3.6 12c0-4.6 3.8-8.4 8.4-8.4s8.4 3.8 8.4 8.4-3.8 8.4-8.4 8.4z"/></svg>

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function capitalizeWords(s){
    return s.split(' ').map(w => w ? (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()) : w).join(' ');
  }

  // ---------- Huecos disponibles ----------
  // Si el punto tocado cae dentro de una cita/bloqueo existente, avanza hasta el siguiente hueco libre.
  function nextFreeStart(dateISO, startMin){
    let candidate = startMin;
    const dayItems = appts.filter(a=>a.date===dateISO);
    let changed = true;
    while(changed){
      changed = false;
      for(const it of dayItems){
        if(candidate >= it.startMin && candidate < it.startMin + it.duration){
          candidate = it.startMin + it.duration;
          changed = true;
        }
      }
    }
    return Math.min(candidate, DAY_END-15);
  }

  function computeGaps(iso){
    const items = appts.filter(a=>a.date===iso).map(a=>({start:a.startMin,end:a.startMin+a.duration})).sort((a,b)=>a.start-b.start);
    const gaps = [];
    let cursor = DAY_START;
    items.forEach(it=>{
      if(it.start > cursor) gaps.push({start:cursor, end:Math.min(it.start,DAY_END)});
      cursor = Math.max(cursor, it.end);
    });
    if(cursor < DAY_END) gaps.push({start:cursor, end:DAY_END});
    return gaps.filter(g=> (g.end-g.start) >= 15);
  }
  function buildGapsPanel(){
    const gaps = computeGaps(selectedISO);
    if(gaps.length===0){
      return `<div class="ag-gaps-panel"><div class="ag-gap-empty">No hay huecos libres de 15 min o más en este día.</div></div>`;
    }
    return `<div class="ag-gaps-panel">
      ${gaps.map(g=>`<div class="ag-gap-chip" data-start="${g.start}" data-end="${g.end}">${minToLabel(g.start)} – ${minToLabel(g.end)} · ${g.end-g.start} min</div>`).join('')}
    </div>`;
  }

  // ---------- Panel nueva / editar ----------
  function getKnownPatients(){
    const map = new Map();
    appts.filter(a=>!a.isBlock && a.name).forEach(a=>{
      const key = a.name.trim().toLowerCase();
      map.set(key, { name: a.name, phone: a.phone||'', type: a.type||'' });
    });
    return Array.from(map.values());
  }

    overlay.innerHTML = `

          </div>

        <div class="ag-panel-actions">
          ${existing? '<button class="ag-btn danger" id="agDelete">Eliminar</button>' : ''}

    `;
    document.body.appendChild(overlay);

    function toggleMode(mode){
      panelMode = mode;
      overlay.querySelectorAll('.ag-mode-tab').forEach(t=>t.classList.toggle('sel', t.getAttribute('data-mode')===mode));
      const patient = mode==='paciente';
      overlay.querySelectorAll('.ag-only-patient').forEach(el=> el.style.display = patient?'':'none');
      overlay.querySelector('#agNameLabel').textContent = patient ? 'Paciente' : 'Motivo del bloqueo';

    function checkOverlapWarning(){
      const timeVal = overlay.querySelector('#agStart').value;
      const duration = parseInt(overlay.querySelector('#agDuration').value,10);
      if(!timeVal) return;
      const [hh,mm] = timeVal.split(':').map(Number);
      const startMin = hh*60+mm, endMin = startMin+duration;
      const conflict = appts.find(a=>{
        if(a.date !== pendingSlot.dateISO) return false;
        if(existing && a.id===existing.id) return false;
        const aEnd = a.startMin+a.duration;
        return startMin < aEnd && endMin > a.startMin;
      });
      const warnEl = overlay.querySelector('#agWarn');
      if(conflict){
        warnEl.style.display='block';
        warnEl.textContent = conflict.isBlock
          ? `⚠ Este horario está bloqueado (${conflict.name}).`
          : `⚠ Se cruza con ${conflict.name} a las ${minToLabel(conflict.startMin)}.`;
      } else {
        warnEl.style.display='none';
      }
    }
    overlay.querySelector('#agStart').addEventListener('input', checkOverlapWarning);
    overlay.querySelector('#agDuration').addEventListener('change', checkOverlapWarning);
    checkOverlapWarning();

    overlay.querySelector('#agCancel').addEventListener('click', ()=> overlay.remove());
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

    if(existing){
      overlay.querySelector('#agDelete').addEventListener('click', async ()=>{
        appts = appts.filter(a=>a.id!==existing.id);
        await saveState();
        overlay.remove();
        render();
      });
    }

    overlay.querySelector('#agSave').addEventListener('click', async ()=>{
      const name = capitalizeWords(overlay.querySelector('#agName').value.trim());
      if(!name){ overlay.querySelector('#agName').focus(); return; }
      const timeVal = overlay.querySelector('#agStart').value;
      const duration = parseInt(overlay.querySelector('#agDuration').value,10);
      const [hh,mm] = timeVal.split(':').map(Number);
      const startMin = hh*60+mm;
      const isPatientMode = panelMode==='paciente';
      const phone = isPatientMode ? overlay.querySelector('#agPhone').value.trim() : '';

      if(editingId){
        const a = appts.find(x=>x.id===editingId);
        a.name=name; a.startMin=startMin; a.duration=duration; a.date=pendingSlot.dateISO;
        a.isBlock = !isPatientMode;
        if(isPatientMode){ a.type=chosenType; a.status=chosenStatus; a.phone=phone; delete a.note; }
        else { delete a.type; delete a.status; delete a.phone; delete a.note; }
      } else {
        const item = {
          id: 'a'+Date.now()+Math.random().toString(16).slice(2),
          date: pendingSlot.dateISO, startMin, duration, name,
          isBlock: !isPatientMode,
        };
        if(isPatientMode){ item.type=chosenType; item.status=chosenStatus; item.phone=phone; }
        appts.push(item);
      }
      await saveState();
      overlay.remove();
      render();
    });
  }
  function minToTimeInput(min){
    const h=Math.floor(min/60), m=min%60;
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  }

  // ---------- Confirm dialog genérico ----------
  function openSettings(){
    const ov = document.createElement('div');
    ov.className = 'ag-confirm-overlay';
    ov.innerHTML = `
      <div class="ag-confirm-box">
        <p style="margin-bottom:6px;font-weight:700;">Código de país (lada)</p>
        <p style="margin-bottom:10px;">Se agrega automáticamente a los números que captures sin lada, para que el botón de WhatsApp funcione. Ej. México = 52.</p>
        <input id="agCountryCode" type="text" inputmode="numeric" value="${escapeHtml(countryCode)}"
          style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);font-size:14px;margin-bottom:14px;"/>
        <div class="ag-confirm-actions">
          <button class="ag-btn primary" id="agSaveSettings">Guardar</button>
          <button class="ag-btn ghost" id="agCancelSettings">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(ov);
    ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.remove(); });
    ov.querySelector('#agCancelSettings').addEventListener('click', ()=> ov.remove());
    ov.querySelector('#agSaveSettings').addEventListener('click', async ()=>{
      const val = ov.querySelector('#agCountryCode').value.replace(/\D/g,'');
      if(val) countryCode = val;
      await saveState();
      ov.remove();
      render();
    });
  }

  function openConfirm(message, options){
    const ov = document.createElement('div');
    ov.className = 'ag-confirm-overlay';
    ov.innerHTML = `
      <div class="ag-confirm-box">
        <p>${escapeHtml(message)}</p>
        <div class="ag-confirm-actions">
          ${options.map((o,i)=>`<button class="ag-btn ${o.style||'ghost'}" data-i="${i}">${escapeHtml(o.label)}</button>`).join('')}
        </div>
      </div>
    `;
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-i]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.getAttribute('data-i'),10);
        ov.remove();
        options[i].action && options[i].action();
      });
    });
  }

  // ---------- Buscador de pacientes ----------
  function openMonthPicker(){
    let viewYear = parseInt(selectedISO.slice(0,4),10);
    let viewMonth = parseInt(selectedISO.slice(5,7),10) - 1; // 0-indexed

    const ov = document.createElement('div');
    ov.className = 'ag-panel-overlay';
    ov.innerHTML = `<div class="ag-month-panel" id="agMonthPanel"></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.remove(); });

    function draw(){
      const panel = ov.querySelector('#agMonthPanel');
      const monthLabel = capitalize(new Date(viewYear, viewMonth, 1).toLocaleDateString('es-MX',{month:'long', year:'numeric'}));
      const firstOfMonth = new Date(viewYear, viewMonth, 1);
      const startOffset = firstOfMonth.getDay(); // 0=Dom
      const gridStart = addDays(firstOfMonth, -startOffset);
      const todayISO = fmtISOtoday();
      const cells = [];
      for(let i=0;i<42;i++){
        const d = addDays(gridStart, i);
        const iso = fmtISO(d);
        const inMonth = d.getMonth()===viewMonth;
        const hasAppt = appts.some(a=>a.date===iso);
        const holiday = getHolidayName(iso);
        cells.push(`<div class="ag-month-cell ${inMonth?'':'is-muted'} ${iso===todayISO?'is-today':''} ${iso===selectedISO?'is-sel':''} ${holiday?'is-holiday':''} ${hasAppt?'has-appt':''}" data-date="${iso}" ${holiday?`title="${holiday}"`:''}>
          <span>${d.getDate()}</span>
          <span class="mdot"></span>
        </div>`);
      }
      panel.innerHTML = `
        <div class="ag-month-head">
          <button data-nav="prev">‹</button>
          <h3>${monthLabel}</h3>
          <button data-nav="next">›</button>
        </div>
        <div class="ag-month-dow">
          <div>D</div><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div>
        </div>
        <div class="ag-month-grid">${cells.join('')}</div>
        <button class="ag-month-today-btn" id="agMonthToday">Ir a hoy</button>
      `;
      panel.querySelector('[data-nav="prev"]').addEventListener('click', ()=>{
        viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; } draw();
      });
      panel.querySelector('[data-nav="next"]').addEventListener('click', ()=>{
        viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; } draw();
      });
      panel.querySelector('#agMonthToday').addEventListener('click', ()=>{
        viewYear = parseInt(todayISO.slice(0,4),10);
        viewMonth = parseInt(todayISO.slice(5,7),10) - 1;
        draw();
      });
      panel.querySelectorAll('.ag-month-cell').forEach(cell=>{
        cell.addEventListener('click', ()=>{
          const iso = cell.getAttribute('data-date');
          const mondayToday = mondayOf(new Date());
          const mondayTarget = mondayOf(new Date(iso+'T00:00:00'));
          weekOffset = Math.round((mondayTarget - mondayToday)/(7*86400000));
          selectedISO = iso;
          ov.remove();
          render();
        });
      });
    }
    draw();
  }

  function openSearch(){
    const ov = document.createElement('div');
    ov.className = 'ag-panel-overlay';
    ov.innerHTML = `
      <div class="ag-search-panel">
        <h3>Buscar paciente</h3>
        <input class="ag-search-input" id="agSearchInput" type="text" placeholder="Nombre o teléfono…" autofocus />
        <div class="ag-search-results" id="agSearchResults"></div>
      </div>
    `;
    document.body.appendChild(ov);
    ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.remove(); });

    const resultsEl = ov.querySelector('#agSearchResults');
    function doSearch(q){
      q = q.trim().toLowerCase();
      if(!q){ resultsEl.innerHTML = `<div class="ag-search-empty">Escribe un nombre o teléfono para buscar.</div>`; return; }
      const matches = appts
        .filter(a=>!a.isBlock)
        .filter(a=> a.name.toLowerCase().includes(q) || (a.phone && a.phone.toLowerCase().includes(q)) )
        .sort((a,b)=> (a.date+String(a.startMin).padStart(4,'0')).localeCompare(b.date+String(b.startMin).padStart(4,'0')))
        .slice(0,40);
      if(matches.length===0){
        resultsEl.innerHTML = `<div class="ag-search-empty">Sin resultados.</div>`;
        return;
      }
      resultsEl.innerHTML = matches.map(a=>{
        const dLbl = new Date(a.date+'T00:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'});
        return `<div class="ag-search-item" data-id="${a.id}" data-date="${a.date}">
          <div>
            <div class="sname">${escapeHtml(a.name)}</div>
            <div class="smeta">${dLbl} · ${minToLabel(a.startMin)}${a.phone? ' · '+escapeHtml(a.phone):''}</div>
          </div>
        </div>`;
      }).join('');
      resultsEl.querySelectorAll('.ag-search-item').forEach(item=>{
        item.addEventListener('click', ()=>{
          const iso = item.getAttribute('data-date');
          const id = item.getAttribute('data-id');
          const mondayToday = mondayOf(new Date());
          const mondayTarget = mondayOf(new Date(iso+'T00:00:00'));
          weekOffset = Math.round((mondayTarget - mondayToday)/(7*86400000));
          selectedISO = iso;
          ov.remove();
          render();
          setTimeout(()=>{
            const el = root.querySelector(`.ag-item[data-id="${id}"]`);
            if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
          }, 50);
        });
      });
    }
    ov.querySelector('#agSearchInput').addEventListener('input', (e)=> doSearch(e.target.value));
    doSearch('');
  }

  (async function init(){
    const safetyTimeout = new Promise(resolve => setTimeout(resolve, 8000));
    await Promise.race([initDb(), safetyTimeout]);
    await Promise.race([
      new Promise(resolve => subscribeState(resolve)),
      new Promise(resolve => setTimeout(()=>{ render(); resolve(); }, 8000))
    ]);
    setInterval(()=>{ render(); }, 60000);
  })();
})();
</script>
